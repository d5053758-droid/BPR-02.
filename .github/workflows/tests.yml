name: tests

on:
  push:
    branches: ["main", "bpr-02-write-test"]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[test]"
      - run: bash -n scripts/first_otc_data_run.sh
      - run: bpr02-smoke
      - run: python -m pytest
