[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bpr02"
version = "0.7.0"
description = "Research-only EUR/USD fixed-time strategy backtesting"
requires-python = ">=3.11"
dependencies = ["pandas>=2.1,<4.0"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
bpr02 = "bpr02.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
