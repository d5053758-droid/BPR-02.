[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bpr02"
version = "0.9.0"
description = "Research-only EUR/USD fixed-time strategy backtesting"
requires-python = ">=3.11"
dependencies = ["pandas>=2.1,<4.0"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
bpr02 = "bpr02.cli:main"
bpr02-stream = "bpr02.signal_bridge:main"
bpr02-review = "bpr02.review:main"
bpr02-replay = "bpr02.replay:main"
bpr02-smoke = "bpr02.smoke_test:main"
bpr02-seconds-backtest = "bpr02.subminute:main"
bpr02-quote-audit = "bpr02.quote_audit:main"
bpr02-otc-data = "bpr02.otc_data:main"
bpr02-resample-candles = "bpr02.resample:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
