services:
  - type: web
    name: bpr02-image-whatsapp-alerts
    runtime: python
    plan: free
    buildCommand: python -m pip install -e .
    startCommand: python -m bpr02.image_alert_api
    healthCheckPath: /health
    envVars:
      - key: BPR02_IMAGE_ALERT_ACTION_TOKEN
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_RECIPIENT
        sync: false
      - key: WHATSAPP_TEMPLATE_NAME
        sync: false
      - key: WHATSAPP_TEMPLATE_LANGUAGE
        value: es_AR
      - key: WHATSAPP_API_VERSION
        value: v26.0
      - key: WHATSAPP_SENT_IDS_PATH
        value: bpr02_whatsapp_sent.jsonl
